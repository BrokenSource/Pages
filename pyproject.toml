[project]
name         = "pages"
description  = "🌎 Website utilities and theme"
authors      = [{name="Tremeschin"}]
classifiers  = ["Private :: Do Not Upload"]
version      = "1.0"
readme       = "readme.md"
license      = "MIT"
dependencies = [
    "python-frontmatter==1.3.0",
    "tdewolff-minify==2.24.12",
    "zensical",
]

[project.scripts]
pages-desc  = "pages.scripts.desc:main"
pages-index = "pages.scripts.index:main"
pages-make  = "pages.scripts.make:main"

[project.entry-points."mkdocs.themes"]
zentheme = "pages.theme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
